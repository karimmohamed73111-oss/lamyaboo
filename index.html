<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jar of notes</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 44%,#fff1f2,#f9dce2 70%,#f5d3db);overflow:hidden}
.scene{width:min(95vw,76svh,530px);aspect-ratio:1;position:relative}
svg{width:100%;height:100%;display:block;overflow:visible}
.scene button{position:absolute;left:27%;top:24%;width:46%;height:58%;border:0;background:transparent;cursor:pointer;border-radius:30%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px dashed #ab576f;outline-offset:7px}
#jar,#lid,#paper{transform-box:fill-box;transform-origin:center}
#jar{transform-origin:center bottom}
#paper{opacity:0}
.draw #jar{animation:rock .54s ease-in-out}
.draw #lid{animation:pop 1.35s both}
.draw #paper{animation:rise 1.6s both}
@keyframes rock{25%{transform:rotate(-3deg)}60%{transform:rotate(2deg)}}
@keyframes pop{0%,16%,100%{transform:none}44%,62%{transform:translate(52px,-30px) rotate(25deg)}}
@keyframes rise{0%,25%{opacity:0;transform:translate(0,125px) rotate(-19deg) scale(.27,.19)}36%{opacity:1}62%{transform:translate(-11px,-13px) rotate(-10deg) scale(.58,.48)}82%{transform:translate(2px,1px) rotate(3deg) scale(1.03)}100%{opacity:1;transform:rotate(-3deg)}}
@media(prefers-reduced-motion:reduce){.draw #jar,.draw #lid{animation:none}.draw #paper{animation:none;opacity:1}}
.fruit {opacity:0; transform-box:view-box; transform-origin:0 0}
.draw .fruit {animation:fruit-flight 1.35s var(--delay) cubic-bezier(.22,.65,.32,1) both}
@keyframes fruit-flight {
 0% {opacity:0;transform:translate(200px,138px) scale(.15)}
 12% {opacity:1}
 64% {opacity:1;transform:translate(var(--peak-x),var(--peak-y)) rotate(var(--spin)) scale(1.05)}
 100% {opacity:1;transform:translate(var(--x),var(--y)) rotate(var(--tilt)) scale(1)}
}
@media(prefers-reduced-motion:reduce){
 .draw .fruit {animation:none;opacity:1;transform:translate(var(--x),var(--y)) rotate(var(--tilt))}
}
.hearts {position:fixed;inset:0;overflow:hidden;pointer-events:none;user-select:none}
.heart {position:absolute;bottom:0;line-height:1;opacity:0;animation:heart-rise var(--duration) var(--delay) ease-out both}
@keyframes heart-rise {
 0% {opacity:0;transform:translateY(105%) rotate(-10deg)}
 15% {opacity:.8}
 52% {opacity:.7;transform:translate(calc(var(--drift) * -.28),calc(var(--rise) * .55)) rotate(9deg)}
 100% {opacity:0;transform:translate(var(--drift),var(--rise)) rotate(-8deg)}
}
@media(prefers-reduced-motion:reduce){
 .heart {bottom:5%;animation-name:heart-fade;animation-duration:.8s}
 @keyframes heart-fade {0%,100% {opacity:0} 40% {opacity:.65}}
}
.balloons {position:fixed;inset:0;overflow:hidden;pointer-events:none}
.balloon {position:absolute;top:100%;width:clamp(46px,9vw,90px);height:auto;
 animation:balloon-flight 22s linear both}
.balloon:first-child {left:9%;--sway:3vw}
.balloon:last-child {right:10%;--sway:-4vw;animation-delay:.6s}
@keyframes balloon-flight {
 0% {transform:translate(0,0) rotate(-3deg)}
 28% {transform:translate(var(--sway),-30vh) rotate(4deg)}
 57% {transform:translate(0,-62vh) rotate(-3deg)}
 91% {transform:translate(var(--sway),-100vh) rotate(3deg)}
 100% {transform:translate(var(--sway),calc(-100vh - 105%)) rotate(1deg)}
}
@media(prefers-reduced-motion:reduce){
 .balloon {top:15%;animation:lantern-fade 2s ease both}
 @keyframes lantern-fade {0%,100% {opacity:0} 35%,65% {opacity:1}}
}
.tools{position:fixed;z-index:2;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font:16px/1.4 system-ui,sans-serif;color:#724957}
.controls{display:flex;align-items:center;justify-content:center;gap:4px}
.controls button{height:44px;min-width:44px;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;touch-action:manipulation;border-radius:9px}
.controls svg{width:30px;height:22px;margin:auto}
.controls button:hover,.controls button[aria-expanded="true"]{background:#fff5f78c}
#history{position:absolute;top:100%;left:50%;transform:translateX(-50%);width:min(280px,90vw);max-height:65svh;overflow:auto;padding:15px;background:#fff8f8;border:1px solid #ddb9c4;border-radius:12px;box-shadow:0 6px 20px #90476318}
#history h2,#history p{font-size:1rem;margin:0}
#history p{margin-top:8px}
#history ol{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
#history ol:empty{display:none}
#history li{background:linear-gradient(100deg,#fffaf0 49%,#f4e4d1 50%,#fff7e9 51%);border:1px solid #e1c8b6;padding:12px;border-radius:2px;white-space:pre-wrap}
#paper-message{height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;color:#674651;font:9px/1.22 Georgia,serif;text-align:center;overflow-wrap:anywhere;white-space:pre-wrap}
#paper-message span{margin:auto 0;max-width:100%}
</style>
</head><body>
<div class="tools">
 <div class="controls">
  <button type="button" id="envelope" aria-label="Drawn notes" aria-expanded="false" aria-controls="history"><svg aria-hidden="true" viewBox="0 0 32 23"><rect x="1" y="1" width="30" height="21" rx="3" fill="#f4c1cd" stroke="#996679"/><path d="m2 3 14 11L30 3M2 20l9-8m19 8-9-8" stroke="#996679" fill="none" stroke-linejoin="round"/></svg></button>
  <button type="button" id="reset">Reset</button>
 </div>
 <section id="history" aria-labelledby="history-title" hidden><h2 id="history-title">Drawn notes</h2><p id="empty">No notes drawn yet.</p><ol></ol></section>
</div>
<div class="balloons" aria-hidden="true"></div>

<path d="M120 298Q122 309 137 312Q197 322 266 312Q277 310 281 301M122 210v41m0 9v7m151 -79q7 8 7 20v26" fill="none" stroke="#fffdfa" stroke-width="4" stroke-linecap="round" opacity=".85"/>
<rect x="139" y="136" width="122" height="14" rx="7" fill="url(#glass)" stroke="#b9959b" stroke-width="1.6"/>
<path d="M145 154Q196 164 256 153" fill="none" stroke="#be6e84" stroke-width="4"/>
<g fill="#e9a2b2" stroke="#b76f84" stroke-width="1.4" stroke-linejoin="round"><path d="M238 157q-29 -24 -34 -10t34 10q18 -26 25 -16t-25 16Z"/><path d="M235 157q-9 15 -10 29l-5 -6 -5 2q5 -17 20 -25Zm3 0q12 17 24 16l-3 6 2 4q-17 -5 -23 -26Z"/><ellipse cx="237" cy="156" rx="4.5" ry="4"/></g>
<g id="lid"><path d="M143 113Q199 104 257 114l-4 23q-53 9 -106 0Z" fill="url(#cork)" stroke="#aa795e" stroke-width="1.5"/><path d="M143 113Q199 104 257 114l-4 23q-53 9 -106 0Z" fill="url(#grain)"/><ellipse cx="200" cy="113" rx="57" ry="7" fill="#e9bf9c" stroke="#b58a6d"/><ellipse cx="200" cy="113" rx="55" ry="6" fill="url(#grain)"/></g>
</g>
</g>
<g id="fruits">
 <use class="fruit" style="--delay:.41s;--peak-x:109px;--peak-y:48px;--x:98px;--y:89px;--spin:-37deg;--tilt:-18deg"/>
 <use class="fruit" style="--delay:.52s;--peak-x:289px;--peak-y:28px;--x:300px;--y:59px;--spin:34deg;--tilt:15deg"/>
 <use class="fruit" style="--delay:.63s;--peak-x:279px;--peak-y:86px;--x:287px;--y:119px;--spin:-22deg;--tilt:-9deg"/>
 <use class="fruit" style="--delay:.69s;--peak-x:98px;--peak-y:15px;--x:105px;--y:35px;--spin:29deg;--tilt:11deg"/>
 <use class="fruit" style="--delay:.76s;--peak-x:118px;--peak-y:95px;--x:113px;--y:137px;--spin:-32deg;--tilt:-12deg"/>
</g>
<g id="paper"><g transform="translate(200 54) scale(1.43) translate(-200 -54)"><path d="m146 20 106 1 -1 66 -105 -2Z" fill="#a26972" opacity=".15" transform="translate(1 4)" filter="url(#blur)"/><path d="m146 20 106 1 -1 66 -105 -2Z" fill="url(#sheet)" stroke="#d3b29f"/><path d="m199 21 -1 64" stroke="#ddcabb" opacity=".5"/>
 <foreignObject x="152" y="25" width="94" height="55"><div xmlns="http://www.w3.org/1999/xhtml" id="paper-message"></div></foreignObject>
</g></g>

<button aria-label="Draw a note from the jar"></button>

<script>
const pile = document.querySelector('#pile');
const folds = [
 [139,285,-24,'#e899ac'],[183,300,13,'#eac3a3'],[226,294,-30,'#d99db7'],[270,287,17,'#dbb7bf'],
 [125,269,39,'#f0bfad'],[164,269,-12,'#eeb9c5'],[202,275,24,'#f7dbba'],[251,265,-36,'#e4a8b6'],
 [144,244,-25,'#efc3a8'],[187,244,12,'#dba5bd'],[222,249,-9,'#f0bcc8'],[268,240,33,'#efd7be'],
 [164,224,22,'#eaa5b4'],[209,225,-33,'#f3cfad'],[244,221,14,'#e8b8c8']
];
for(const [x,y,angle,color] of folds){
 const note=document.createElementNS(pile.namespaceURI,'use');
 note.setAttribute('href','#fold');
 note.setAttribute('transform','translate('+x+' '+y+') rotate('+angle+') scale(1.46 1.32)');
 note.style.color=color;
 pile.append(note);
}
const scene=document.querySelector('.scene');
const fruitTypes = ['strawberry', 'raspberry', 'mango'];
const fruits = document.querySelectorAll('.fruit');
const heartLayer = document.querySelector('.hearts');
const heartColors = ['#cb6082', '#df7893', '#be5479', '#e98da2'];
function releaseHearts() {
 const count = 5 + Math.floor(Math.random() * 6);
 const burst = document.createDocumentFragment();
 for (let i = 0; i < count; i++) {
   const heart = document.createElement('span');
   heart.className = 'heart';
   heart.textContent = '♥';
   heart.style.left = ((i + Math.random()) / count * 94 + 1) + '%';
   heart.style.fontSize = (17 + Math.random() * 19) + 'px';
   heart.style.color = heartColors[i % heartColors.length];
   heart.style.setProperty('--rise', -(38 + Math.random() * 45) + 'vh');
   heart.style.setProperty('--drift', (Math.random() * 16 - 8) + 'vw');
   heart.style.setProperty('--delay', (.45 + Math.random() * .65) + 's');
   heart.style.setProperty('--duration', (2 + Math.random() * 1.4) + 's');
   heart.addEventListener('animationend', () => heart.remove(), {once:true});
   burst.append(heart);
 }
 heartLayer.replaceChildren(burst);
}
const envelope = document.querySelector('#envelope');
const historyPanel = document.querySelector('#history');
const noteList = historyPanel.querySelector('ol');
const emptyState = document.querySelector('#empty');
const storageKey = 'note-jar.drawn-notes.v1';
let drawnNotes = [];
try {
 const saved = JSON.parse(localStorage.getItem(storageKey));
 if (Array.isArray(saved)) drawnNotes = saved.filter(note => typeof note === 'string');
} catch { /* Storage can be unavailable when opened as a local file. */ }

function saveNotes() {
 try { localStorage.setItem(storageKey, JSON.stringify(drawnNotes)); } catch {}
}
function renderHistory() {
 noteList.replaceChildren();
 drawnNotes.forEach((message, index) => {
   const slip = document.createElement('li');
   slip.textContent = message || ('Note ' + (index + 1));
   noteList.prepend(slip);
 });
 emptyState.hidden = drawnNotes.length > 0;
}
function showHistory(open) {
 if (open) renderHistory();
 historyPanel.hidden = !open;
 envelope.setAttribute('aria-expanded', String(open));
}
envelope.addEventListener('click', () => showHistory(historyPanel.hidden));
document.addEventListener('keydown', event => {
 if (event.key === 'Escape' && !historyPanel.hidden) {
   showHistory(false);
   envelope.focus();
 }
});
document.querySelector('#reset').addEventListener('click', () => {
 drawnNotes = [];
 saveNotes();
 renderHistory();
 showHistory(false);
 scene.classList.remove('draw');
 heartLayer.replaceChildren();
 document.querySelector('.balloons').replaceChildren();
});
scene.querySelector('button').addEventListener('click',()=>{
 const messages = Array.from(document.querySelector('#personal-notes').content.querySelectorAll('p'),
   slot => slot.textContent.trim()).filter(Boolean);
 const recent = drawnNotes.filter(text => messages.includes(text)).slice(-(messages.length - 1 || 1));
 const remaining = messages.filter(text => !recent.includes(text));
 const choices = remaining.length ? remaining : messages;
 const message = choices[Math.floor(Math.random() * choices.length)] || '';
 const paperMessage = document.querySelector('#paper-message');
 const line = document.createElement('span');
 line.textContent = message;
 paperMessage.replaceChildren(line);
 drawnNotes.push(message);
 saveNotes();
 showHistory(false);
 scene.classList.remove('draw');
 for (const fruit of fruits) {
   const kind = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
   fruit.setAttribute('href', '#' + kind);
 }
 void scene.offsetWidth;
 scene.classList.add('draw');
 releaseHearts();
 const pair = document.querySelector('#balloon-pair').content.cloneNode(true);
 for (const balloon of pair.children) {
   balloon.addEventListener('animationend', () => balloon.remove(), {once:true});
 }
 document.querySelector('.balloons').replaceChildren(pair);
});
</script>
 <style>
  #envelope {
    position: relative;
  }

  #note-count {
    position: absolute;
    top: 0;
    right: -3px;
    padding: 2px 5px;
    border-radius: 12px;
    background: #a34869;
    color: white;
    font: 600 11px/1.2 system-ui, sans-serif;
    pointer-events: none;
  }
</style>

<script>
  const envelopeButton = document.querySelector('#envelope');
  const noteCount = document.createElement('span');
  noteCount.id = 'note-count';
  noteCount.setAttribute('aria-hidden', 'true');
  envelopeButton.append(noteCount);

  function updateNoteCount() {
    const count = Math.min(drawnNotes.length, 40);
    noteCount.textContent = `${count}/40`;
    envelopeButton.setAttribute('aria-label', `Drawn notes, ${count} of 40`);
  }

  document.querySelector('.scene button').addEventListener('click', updateNoteCount);
  document.querySelector('#reset').addEventListener('click', updateNoteCount);
  updateNoteCount();
</script>
</body></html>
